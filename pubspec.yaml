name: pdf_viewer_pro
description: |
  A full-featured Flutter PDF viewer built on PDFium (pdfrx). Includes annotations,
  bookmarks, full-text search, thumbnails, table of contents, auto-scroll, dark/light
  themes, DRM screenshot protection, and optional server-sync callbacks.
version: 0.0.1
homepage: https://codingfrontend.in
repository: https://github.com/Coding-Frontend/pdf_viewer_pro
issue_tracker: https://github.com/Coding-Frontend/pdf_viewer_pro/issues

topics:
  - pdf
  - viewer
  - drm
  - annotations
  - flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^1.0.91
  screen_protector: ^1.4.10
  path_provider: ^2.1.5
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
